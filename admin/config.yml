# Sveltia CMS : édition des articles et des fiches jeux.
# Connexion : « Se connecter avec un jeton d'accès personnel » (GitHub).
# Les modifications sont enregistrées sur la branche dev (https://dev.sophielenaerts.be).
backend:
  name: github
  repo: ced64k/sophie
  branch: dev

locale: fr
site_url: https://dev.sophielenaerts.be
media_folder: static/img
public_folder: /static/img

collections:
  - name: blog
    label: Articles
    label_singular: Article
    folder: posts
    create: true
    slug: "{{year}}-{{month}}_{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date de publication, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Image de couverture, name: image, widget: image, required: false, hint: "Facultatif : sinon la première image du texte est utilisée." }
      - { label: Catégories, name: categories, widget: list, required: false, hint: "Mêmes identifiants que les anciennes catégories du site (ex. langage-oral)." }
      - { label: Texte, name: body, widget: markdown }

  - name: jeux
    label: Fiches jeux
    label_singular: Fiche jeu
    folder: jeux
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Auteur, name: author, widget: string, default: Sophie Lenaerts }
      - { label: Image de la vignette, name: image, widget: image, required: false, hint: "Facultatif : sinon la première image du texte est utilisée." }
      - { label: Texte, name: body, widget: markdown, hint: "Les titres de niveau 2 (##) classent la fiche par domaine : Langage oral, Langage écrit, Mathématiques, Méthodologie, Bégaiement." }

  - name: pages
    label: Pages
    label_singular: Page
    folder: pages
    create: false
    extension: md
    filter: { field: layout, value: layouts/page.njk }
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Description (moteurs de recherche), name: metaDescription, widget: text, required: false }
      - { label: Texte, name: body, widget: markdown }
