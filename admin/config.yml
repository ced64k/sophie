# Sveltia CMS : édition des articles et des fiches jeux.
# Connexion : « Se connecter avec un jeton d'accès personnel » (GitHub).
# Les modifications sont enregistrées sur la branche dev (https://dev.sophielogo.be).
backend:
  name: github
  repo: ced64k/sophie
  branch: dev

locale: fr
site_url: https://dev.sophielogo.be
media_folder: static/img
public_folder: /static/img

collections:
  - name: blog
    label: Articles
    label_singular: Article
    folder: posts
    create: true
    slug: "{{year}}-{{month}}_{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date de publication, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Image de couverture, name: image, widget: image, required: false, hint: "Facultatif : sinon la première image du texte est utilisée." }
      # Valeurs reconnues par _data/classement.json (domaines, publics, thèmes) : garder les deux listes identiques
      - label: Catégories
        name: categories
        widget: select
        multiple: true
        required: false
        hint: "Le domaine (oral, écrit, maths, méthodologie) place l'article dans les filtres de la page Articles."
        options:
          - { label: "Domaine : Langage oral", value: langage-oral }
          - { label: "Domaine : Langage écrit", value: langage-ecrit }
          - { label: "Domaine : Langage écrit (grammaire)", value: grammaire }
          - { label: "Domaine : Cognition mathématique", value: mathematique }
          - { label: "Domaine : Méthodologie", value: methodologie }
          - { label: "Public : Pour les parents", value: pour-les-parents }
          - { label: "Public : Pour les instits", value: pour-les-instits }
          - { label: "Thème : À télécharger", value: telechargements-gratuits }
          - { label: "Thème : Jeux", value: jeux-educatifs }
          - { label: "Thème : Matériel pédagogique", value: materiel-pedagogique }
          - { label: "Thème : Création de matériel", value: creation-de-materiel }
          - { label: "Thème : Livres", value: livres }
          - { label: "Thème : Ateliers", value: ateliers }
          - { label: "Thème : Réflexions", value: du-blabla }
      - { label: Texte, name: body, widget: markdown }

  - name: jeux
    label: Fiches jeux
    label_singular: Fiche jeu
    folder: jeux
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Les fiches sont classées de la plus récente à la plus ancienne." }
      - { label: Auteur, name: author, widget: string, default: Sophie Lenaerts }
      - { label: Image de la vignette, name: image, widget: image, required: false, hint: "Facultatif : sinon la première image du texte est utilisée." }
      - { label: Marque, name: marque, widget: string, required: false, hint: "Éditeur du jeu (ex. Djeco)." }
      - { label: Âge, name: age, widget: string, required: false, hint: "Ex. 4 ans et +" }
      - { label: Texte, name: body, widget: markdown, hint: "Les titres de niveau 2 (##) classent la fiche par domaine : Langage oral, Langage écrit, Mathématiques, Méthodologie, Bégaiement." }

  - name: pages
    label: Pages
    label_singular: Page
    folder: pages
    create: false
    extension: md
    filter: { field: layout, value: layouts/page.njk }
    fields:
      - { label: Modèle de page, name: layout, widget: hidden }
      - { label: Titre, name: title, widget: string }
      - { label: Description (moteurs de recherche), name: metaDescription, widget: text, required: false }
      - { label: Texte, name: body, widget: markdown }
