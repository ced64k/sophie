name: Build et déploiement

# Chaque push compile le site. Un push sur main publie sur https://sophielenaerts.be (VPS Infomaniak, dossier /var/www/sophie),
# un push sur dev publie sur https://dev.sophielenaerts.be (dossier /var/www/devsophie).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Social images already drawn are kept between two builds (the cache key changes with the design or the photos)
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ hashFiles('_og/**', 'static/img/fiches/**', 'static/img/koala.svg', 'static/img/fabric-texture-gris.webp') }}-${{ github.run_id }}
          restore-keys: og-

      # L'admin Sveltia écrit sur la branche du site où il est servi : sur main, il édite main (production)
      - name: Admin pointe sur main
        if: github.ref == 'refs/heads/main'
        run: sed -i -e 's/^  branch: dev$/  branch: main/' -e 's#^site_url: .*#site_url: https://sophielenaerts.be#' admin/config.yml

      - run: npx @11ty/eleventy

      - uses: actions/upload-artifact@v4
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
        with:
          name: site
          path: _site

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          DEST=sophie
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then DEST=devsophie; fi
          rsync -rlptz --delete _site/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/$DEST/
