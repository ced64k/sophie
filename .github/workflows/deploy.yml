name: Build et déploiement

# Chaque push compile le site. Un push sur main publie sur https://sophielenaerts.be (VPS Infomaniak, dossier /var/www/sophie).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx @11ty/eleventy

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: rsync -rlptz --delete _site/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/sophie/
